<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#061912"/>
      <stop offset="100%" stop-color="#0a251b"/>
    </linearGradient>
    <linearGradient id="sunGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d99a38"/>
      <stop offset="100%" stop-color="#c86d51"/>
    </linearGradient>
    <linearGradient id="peakFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#65b88e"/>
      <stop offset="100%" stop-color="#143d2d"/>
    </linearGradient>
    <linearGradient id="peakBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#205540"/>
      <stop offset="100%" stop-color="#0a251b"/>
    </linearGradient>
  </defs>
  <!-- Background Disc -->
  <rect width="64" height="64" rx="14" fill="url(#skyGrad)"/>
  
  <!-- Himalayan Sun / Dawn Orb -->
  <circle cx="32" cy="22" r="10" fill="url(#sunGrad)"/>
  
  <!-- Back Snow Ridge -->
  <polygon points="12,54 28,26 44,54" fill="url(#peakBack)"/>
  <polygon points="28,26 33,35 28,33 23,35" fill="#faf8f2" opacity="0.9"/>
  
  <!-- Front Mountain Ridge -->
  <polygon points="22,54 42,20 60,54" fill="url(#peakFront)"/>
  <polygon points="42,20 48,31 42,28 36,31" fill="#ffffff" opacity="0.95"/>
  
  <!-- Pine Tree Accent -->
  <polygon points="16,54 19,45 22,54" fill="#65b88e"/>
  <polygon points="17.5,47 19,42 20.5,47" fill="#65b88e"/>
</svg>